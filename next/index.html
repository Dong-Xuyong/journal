<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ef" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Journal" />
  <title>Journal & Reviews</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="../dong-ui/theme.css" />
  <link rel="stylesheet" href="/ui/shell.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <script src="../dong-ui/theme.js"></script>
</head>
<body class="dx">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="dx-header">
    <a class="dx-home" href="/" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    </a>
    <h1 class="dx-title">Journal &amp; Reviews</h1>
    <div class="dx-actions">
      <span id="sync-label" aria-live="polite"></span>
      <button type="button" data-dong-theme-toggle aria-label="Toggle color theme"></button>
    </div>
  </header>
  <nav id="tabs" class="dx-tabs" aria-label="Review period"></nav>
  <nav id="crumbs" class="crumbs" aria-label="Breadcrumb"></nav>
  <main id="main" tabindex="-1">
    <div class="period dx-card">
      <h2 id="period-heading" tabindex="-1"></h2>
      <div class="period-nav">
        <button type="button" id="prev" class="dx-btn dx-btn--ghost">Previous</button>
        <button type="button" id="today" class="dx-btn dx-btn--ghost">Today</button>
        <button type="button" id="next" class="dx-btn dx-btn--ghost">Next</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
  <footer id="connect">
    <button type="button" id="btn-connect" class="dx-btn">Connect GitHub</button>
  </footer>
  <div id="announce" class="sr-only" aria-live="polite"></div>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
